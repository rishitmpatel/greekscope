[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greekscope"
version = "0.1.0"
description = "Option pricing, Greeks, implied volatility and strategy analysis in pure numpy/scipy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishit Patel" }]
keywords = ["options", "black-scholes", "greeks", "implied-volatility", "heston", "quant", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Education",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
greekscope = "greekscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slower Monte Carlo / numerical integration tests"]
